name: Release

# Déclenché par un tag "vX.Y.Z" (ex: git tag v0.1.0 && git push --tags).
# Build un artefact et le joint à une GitHub Release.
#
# État actuel : tant qu'aucun secret de signature n'est configuré, le job
# retombe sur un APK debug (installable pour tester, PAS publiable sur le
# Play Store). Dès que les secrets Android ci-dessous existent dans le repo
# (Settings > Secrets and variables > Actions), le job bascule automatiquement
# sur un App Bundle (.aab) signé en production — rien à modifier dans ce fichier.
#
#   Android : ANDROID_KEYSTORE_BASE64 (le .jks encodé en base64),
#             ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             (+ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON plus tard, pour l'upload
#             automatique vers Play Console via fastlane, non implémenté ici)
#   iOS     : nécessite en plus un compte Apple Developer Program — non couvert
#             par ce workflow pour l'instant

on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.35.2"

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

      # Reconstruit le keystore de prod à partir des secrets s'ils sont configurés.
      # Tant qu'ils ne le sont pas, on reste sur l'APK debug (fallback ci-dessous).
      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../../upload-keystore.jks
          EOF

      - name: Build release App Bundle (Play Store)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release

      - name: Build debug APK (fallback, signature prod pas encore configurée)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: flutter build apk --debug

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
